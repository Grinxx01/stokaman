<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stokaman</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Stokaman</h1>
    <nav>
      <button class="tab active" data-tab="kasir">Kasir</button>
      <button class="tab" data-tab="stok">Stok</button>
      <button class="tab" data-tab="riwayat">Riwayat</button>
    </nav>
  </header>

  <main>
    <section id="tab-kasir" class="panel active">
      <div class="kasir-grid">
        <div class="card">
          <div class="scan-row">
            <input id="kasir-barcode" type="text" inputmode="numeric" placeholder="Scan atau ketik barcode...">
            <button id="kasir-scan-btn" class="btn-scan" title="Scan dengan kamera">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>
            </button>
          </div>
          <div id="cart" class="cart"><p class="empty">Keranjang masih kosong. Scan barang untuk mulai.</p></div>
          <div class="cart-total">
            <span>Total</span>
            <strong id="cart-total">Rp 0</strong>
          </div>
          <button id="checkout-btn" class="btn-primary" disabled>Bayar</button>
        </div>
        <div class="card">
          <h2>Produk</h2>
          <input id="kasir-search" type="search" placeholder="Cari produk...">
          <div id="kasir-products" class="product-grid"></div>
        </div>
      </div>
    </section>

    <section id="tab-stok" class="panel">
      <div class="toolbar">
        <input id="stok-search" type="search" placeholder="Cari produk...">
        <button id="stok-add-btn" class="btn-primary">+ Tambah Barang</button>
      </div>
      <div id="stok-alerts" class="alerts"></div>
      <div class="table-wrap card">
        <table id="stok-table">
          <thead>
            <tr>
              <th>Barcode</th>
              <th>Nama</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Kadaluarsa</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="stok-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-riwayat" class="panel">
      <div id="riwayat" class="history"></div>
    </section>
  </main>

  <div id="scan-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="scan-title">Scan Barcode</h2>
        <button class="btn-close" data-close="scan-modal">&times;</button>
      </div>
      <div id="reader" class="reader"></div>
      <p class="hint">Arahkan barcode ke kamera. Pastikan pencahayaan cukup.</p>
    </div>
  </div>

  <div id="form-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="form-title">Tambah Barang</h2>
        <button class="btn-close" data-close="form-modal">&times;</button>
      </div>
      <form id="product-form">
        <input id="f-barcode" type="text" inputmode="numeric" placeholder="Barcode" required>
        <button type="button" id="form-scan-btn" class="btn-secondary">Scan Barcode</button>
        <input id="f-name" type="text" placeholder="Nama produk" required>
        <input id="f-category" type="text" placeholder="Kategori (opsional)">
        <div class="form-row">
          <input id="f-price" type="number" min="0" step="100" placeholder="Harga jual" required>
          <input id="f-stock" type="number" min="0" step="1" placeholder="Stok" required>
        </div>
        <label for="f-expiry">Tanggal kadaluarsa</label>
        <input id="f-expiry" type="date">
        <p id="expiry-hint" class="hint"></p>
        <button type="submit" class="btn-primary">Simpan</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
